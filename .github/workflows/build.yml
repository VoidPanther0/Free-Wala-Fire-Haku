name: Build

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows DLL
    runs-on: windows-latest

    env:
      SOLUTION: "Free wala Haku.sln"
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore dependencies (NuGet)
        run: nuget restore "${{ env.SOLUTION }}"

      - name: Build solution (ISO C++20)
        run: msbuild "${{ env.SOLUTION }}" /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }} /p:LanguageStandard=stdcpp20 /m /v:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Free-wala-Haku-${{ env.CONFIGURATION }}
          path: |
            bin/*.dll
            bin/*.pdb
            bin/*.lib
          if-no-files-found: warn
          retention-days: 30

      - name: Auto-publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            bin/*.dll
            bin/*.pdb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
